name: docker build and push

on:
  push:
    branches: main
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: checkout cloudflared
        uses: actions/checkout@v4
        with:
          repository: cloudflare/cloudflared
          path: cloudflared
          # full history so `git describe` yields a proper version string
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: install buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: login to docker hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # `latest` is a multi-arch manifest (arm/v7 + arm/v5); the per-arch tags
      # reuse the same build cache and exist for clients that can't pick a
      # variant from a manifest list themselves.
      - name: build images and push to docker hub
        run: |
          docker buildx build --push --provenance=false --sbom=false \
            --tag stroebs/cloudflared:latest \
            --platform linux/arm/v7,linux/arm/v5 .
          docker buildx build --push --provenance=false --sbom=false \
            --tag stroebs/cloudflared:arm32v7 \
            --platform linux/arm/v7 .
          docker buildx build --push --provenance=false --sbom=false \
            --tag stroebs/cloudflared:arm32v5 \
            --platform linux/arm/v5 .
